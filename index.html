<style>
:root{
  --bg:#0b0c0e; --card:#14161a; --card-h:#1b1e23; --line:#262a31;
  --text:#f2efe8; --muted:#8d939c; --amber:#f5a524; --teal:#2dd4bf; --wa:#25d366;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f6f3ec; --card:#ffffff; --card-h:#fbf8f1; --line:#e2ddd0;
    --text:#16181c; --muted:#6b707a; --amber:#c97e00; --teal:#0f8f80; --wa:#1a9e4d;
  }
}
:root[data-theme="light"]{
  --bg:#f6f3ec; --card:#ffffff; --card-h:#fbf8f1; --line:#e2ddd0;
  --text:#16181c; --muted:#6b707a; --amber:#c97e00; --teal:#0f8f80; --wa:#1a9e4d;
}
:root[data-theme="dark"]{
  --bg:#0b0c0e; --card:#14161a; --card-h:#1b1e23; --line:#262a31;
  --text:#f2efe8; --muted:#8d939c; --amber:#f5a524; --teal:#2dd4bf; --wa:#25d366;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{
  background:var(--bg); color:var(--text);
  font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  min-height:100vh; display:flex; justify-content:center;
  background-image:radial-gradient(600px 300px at 50% -80px, color-mix(in srgb,var(--amber) 14%,transparent), transparent 70%);
}
.wrap{width:100%;max-width:460px;padding:28px 20px 40px}
.rail{
  height:14px;margin:0 -20px 22px;
  background:
    repeating-linear-gradient(90deg, transparent 0 10px, var(--line) 10px 22px, transparent 22px 30px);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  opacity:.9;
}
.tc{font-size:11px;letter-spacing:.18em;color:var(--teal);text-align:center;font-variant-numeric:tabular-nums}
.avatar{
  width:92px;height:92px;border-radius:50%;margin:26px auto 14px;
  display:grid;place-items:center;
  font-family:'Bebas Neue',Impact,sans-serif;font-size:42px;letter-spacing:.04em;color:#0b0c0e;
  background:linear-gradient(135deg,var(--amber),var(--teal));
  box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--line);
}
h1{margin-bottom:30px;font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:44px;letter-spacing:.05em;text-align:center;line-height:1}
.role{text-align:center;color:var(--muted);font-size:14px;margin-top:8px}
.tags{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0 26px}
.tag{font-size:12px;padding:5px 11px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
.tag b{color:var(--amber);font-weight:500}
.links{display:flex;flex-direction:column;gap:12px}
.link{
  display:flex;align-items:center;gap:14px;padding:15px 16px;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  color:var(--text);text-decoration:none;transition:transform .15s,border-color .15s,background .15s;
}
.link:hover,.link:focus-visible{transform:translateY(-2px);background:var(--card-h);border-color:var(--amber);outline:none}
.ico{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;flex:none}
.ico svg{width:22px;height:22px;fill:#fff}
.ig{background:linear-gradient(45deg,#f9a03f,#e1306c 55%,#7a3fd1)}
.wa{background:var(--wa)}
.mail{background:linear-gradient(135deg,var(--amber),#d9480f)}
.txt{flex:1;min-width:0}
.txt strong{display:block;font-size:18px;font-weight:700}
.txt span{display:block;font-size:13px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arrow{color:var(--muted);font-size:18px}
.cta{border-color:color-mix(in srgb,var(--wa) 55%,var(--line))}
footer{margin-top:30px;text-align:center;font-size:12px;color:var(--muted);letter-spacing:.08em}
</style>
</head>
